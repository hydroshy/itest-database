# Connect to existing PostgreSQL. Does not create or replace its data volume.
services:
  db-migrator:
    image: postgres:17-alpine
    container_name: itest-db-migrator
    restart: "no"
    environment:
      PGHOST: ${PGHOST:-itest-postgres}
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:?Set actual existing PostgreSQL user}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set actual existing PostgreSQL password}
      PGDATABASE: ${ITEST_DB:-itest_platform}
      REPO_URL: ${DB_REPO_URL:-https://github.com/hydroshy/itest-database.git}
      REPO_BRANCH: ${DB_REPO_BRANCH:-main}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - itest_db_source:/opt/itest-database
    networks:
      - postgres_net
    entrypoint:
      - /bin/sh
      - -ec
      - |
        apk add --no-cache git
        WORKDIR=/opt/itest-database
        if [ ! -d "$$WORKDIR/.git" ]; then
          git clone --branch "$$REPO_BRANCH" "$$REPO_URL" "$$WORKDIR"
        else
          cd "$$WORKDIR"
          git fetch origin "$$REPO_BRANCH"
          git reset --hard "origin/$$REPO_BRANCH"
        fi
        cd "$$WORKDIR"
        git log -1 --oneline

        # Authenticated connection check. Fail instead of waiting indefinitely.
        psql -X -v ON_ERROR_STOP=1 -d postgres -c 'SELECT current_user;'

        # Quote database name as SQL literal and identifier, not shell SQL interpolation.
        psql -X -v ON_ERROR_STOP=1 -d postgres -v db="$$PGDATABASE" <<'SQL'
        SELECT format('CREATE DATABASE %I', :'db')
        WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = :'db')
        \gexec
        SQL

        # Link schemas to /opt/schemas for SQL scripts containing absolute \i /opt/schemas/ references
        mkdir -p /opt && ln -sfn "$$WORKDIR/schemas" /opt/schemas

        psql -X -v ON_ERROR_STOP=1 -f init-scripts/01-init-databases.sql
        for schema_dir in system plugins ops-agent lorawan-chirpstack memmap-manager finalconfig-manager traceability-manager devices decoder; do
          psql -X -v ON_ERROR_STOP=1 -f "schemas/$$schema_dir/schema.sql"
        done

        # Existing SQL is replayed in order. Stop on first error; inspect before retry.
        for schema_dir in system plugins ops-agent lorawan-chirpstack memmap-manager finalconfig-manager traceability-manager devices decoder; do
          for migration in "schemas/$$schema_dir/migrations/"*.sql; do
            [ -f "$$migration" ] || continue
            echo ">>> $$migration"
            psql -X -v ON_ERROR_STOP=1 -f "$$migration"
          done
        done
        echo '=== Database migration complete ==='

volumes:
  itest_db_source: null

networks:
  postgres_net:
    external: true
    name: ${POSTGRES_NETWORK:-itest_net}
